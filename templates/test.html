<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mock Test — AI StudyMate</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="/" class="brand-logo">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </div>
        <span>AI StudyMate</span>
      </a>

      <div style="font-weight: 700; color: var(--primary); font-size: 0.95rem;">
        📝 Timed Mock Test Session
      </div>
    </div>
  </nav>

  <main class="main-content">
    <div class="container test-layout">
      
      <!-- Top Bar with Progress and 60s Timer -->
      <div class="test-topbar">
        <div class="test-progress-info">
          <div class="test-progress-text">
            Question <span id="q-number-display">1</span> of <span id="q-total-display">20</span>
          </div>

          <div class="test-progress-bar-wrap">
            <div id="test-progress-bar-fill" class="test-progress-bar-inner"></div>
          </div>
        </div>

        <!-- 60s Timer Badge -->
        <div id="timer-display" class="timer-badge">
          ⏱ 01:00
        </div>
      </div>

      <!-- Main Question Card -->
      <div class="question-card">
        <div class="question-meta-row">
          <span id="question-topic-badge" class="badge badge-primary">Topic</span>
          <span id="question-diff-badge" class="badge badge-neutral">Medium</span>
        </div>

        <h3 id="question-prompt" class="question-prompt">
          Loading question text...
        </h3>

        <!-- Options List -->
        <div id="options-container" class="options-list">
          <!-- Dynamic 4 Options (A, B, C, D) -->
        </div>
      </div>

      <!-- Action Buttons Bar -->
      <div class="test-actions-bar">
        <button type="button" id="prev-btn" class="btn btn-secondary" disabled>
          ← Previous
        </button>

        <div>
          <button type="button" id="next-btn" class="btn btn-primary">
            Next Question →
          </button>
          
          <button type="button" id="submit-btn" class="btn btn-success" style="display: none;">
            ✓ Submit Test
          </button>
        </div>
      </div>

      <!-- Question Navigator -->
      <div class="navigator-box">
        <div class="navigator-title">
          <span>Question Navigator</span>
          <span class="text-xs text-muted">Click to jump to unexpired questions</span>
        </div>
        <div id="navigator-grid" class="nav-grid">
          <!-- Numbers 01, 02, ... -->
        </div>
      </div>

    </div>
  </main>

  <!-- Submit Confirmation Modal -->
  <div id="submit-modal" class="modal-overlay">
    <div class="modal-dialog">
      <div style="font-size: 2rem; margin-bottom: 0.75rem;">📋</div>
      <h3 style="margin-bottom: 0.5rem;">Submit Mock Test?</h3>
      <p class="text-secondary" style="font-size: 0.95rem; margin-bottom: 1.5rem;">
        You have answered <strong id="modal-answered-count">0</strong> of <strong id="modal-total-count">20</strong> questions.<br>
        Are you ready to submit and study your results?
      </p>

      <div style="display: flex; gap: 0.75rem; justify-content: center;">
        <button type="button" id="modal-cancel-btn" class="btn btn-secondary">
          Cancel & Continue
        </button>
        <button type="button" id="modal-confirm-btn" class="btn btn-primary">
          Confirm & Submit
        </button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  <script src="{{ url_for('static', filename='js/test.js') }}"></script>
</body>
</html>
